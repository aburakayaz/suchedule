name: Auto Update Data

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger
  
jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          
      - name: Scrape recent terms
        run: |
          # Writes data/<term>.min.json for every term since Fall 1999-2000 that has classes on Banner,
          # plus data/terms.json. Only the 4 newest terms are scraped again; older ones are kept as they are.
          python scraper/update_data.py --since 199901 --refresh 4

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "Changes detected in scraped data"
            git status --short data/
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected in scraped data"
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update course data"
          title: "Course Data Update"
          body: |
            Automated data update of the terms listed in `data/terms.json`.
            
            This PR was automatically generated by GitHub Actions.
          branch: auto-update-data
          base: master
          delete-branch: true